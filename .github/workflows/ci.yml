name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Run offline tests with coverage
        run: python -m coverage run -m pytest
      - name: Coverage report
        run: python -m coverage report -m
      - name: Benchmark replay
        run: python -m web_crawling benchmark --index-file invert_index.json --history-file logs/perf_history.jsonl --runs 2
      - name: Upload benchmark history
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.os }}-${{ matrix.python-version }}
          path: logs/perf_history.jsonl

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pip-audit==2.10.1
      - name: Audit installed dependencies against known advisories
        run: python -m pip_audit --skip-editable --strict --format=json --output dependency-audit.json
      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json

  package:
    runs-on: ${{ matrix.os }}
    needs: [quality-and-tests, dependency-audit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install build==1.2.2.post1
      - name: Build source distribution and wheel
        run: python -m build
      - name: Install wheel into a clean environment and exercise it offline
        run: python scripts/check_package.py --dist dist --venv "${{ runner.temp }}/web-crawling-package-smoke"
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
